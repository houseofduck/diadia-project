[build]
builder = "NIXPACKS"
watchPatterns = ["frontend/**"]

[build.nixpacksPlan.phases.install]
dependsOn = ["setup"]
cmds = ["bun install"]

[build.nixpacksPlan.phases.build]
dependsOn = ["install"]
cmds = ["bun run build"]

[deploy]
startCommand = "bun run start"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10